<app-search-bar [(searchText)]="searchText"/>
<div id="card-list">
  @for (monster of filteredMonsters(); track monster) {
    <app-playing-card [monster]="monster"/>
  } @empty {
    <div class="center">No monster found!</div>
  }
</div>
@if (filteredMonsters().length > 0) {
  <div class="center">Found {{ filteredMonsters().length }} monster(s)!</div>
}
<div class="center">
  <button (click)="addGenericMonster()">Add Generic Monster</button>
</div>
